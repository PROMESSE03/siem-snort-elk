# =============================================================================
#  Règle ElastAlert2 — Scénario 4 : Injection SQL (web)
# =============================================================================
name: "Injection SQL detectee"
type: any
index: "snort-alerts-*"

filter:
  - query:
      query_string:
        query: 'sid:(1000030 OR 1000031 OR 1000032)'

query_key: "src_addr"
realert:
  minutes: 2

alert:
  - slack

slack_webhook_url: "REMPLACER_PAR_VOTRE_WEBHOOK"
slack_username_override: "Snort IDS"
slack_emoji_override: ":syringe:"
slack_msg_color: "danger"
slack_title: ":rotating_light: Attaque — Injection SQL"
alert_text_type: alert_text_only
alert_text: |-
  *Type*      : Injection SQL (attaque applicative web)
  *Source*    : {0}
  *Cible*     : {1}
  *Signature* : {2}
  *Priorite*  : {3}
  *Horodatage*: {4}
alert_text_args:
  - src_addr
  - dst_addr
  - msg
  - priority
  - "@timestamp"
