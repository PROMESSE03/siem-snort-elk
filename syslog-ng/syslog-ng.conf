@version: 4.8
@include "scl.conf"

# =============================================================================
#  syslog-ng — collecte des alertes Snort 3 (JSON) et envoi vers Elasticsearch
#
#  Flux :  fichier alert_json.txt (Snort)
#            -> parsing JSON
#            -> enrichissement (champ @timestamp)
#            -> destination elasticsearch-http (index snort-alerts-AAAA.MM.JJ)
# =============================================================================

options {
    chain_hostnames(off);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    keep_hostname(yes);
    time_reopen(5);
    stats(freq(60));
};

# -----------------------------------------------------------------------------
#  SOURCE 1 — fichier d'alertes JSON écrit par Snort
# -----------------------------------------------------------------------------
source s_snort_json {
    file(
        "/var/log/snort/alert_json.txt"
        follow-freq(1)
        flags(no-parse)          # on récupère la ligne brute dans ${MESSAGE}
        program-override("snort")
    );
};

# -----------------------------------------------------------------------------
#  SOURCE 2 — syslog réseau (autres équipements, optionnel)
# -----------------------------------------------------------------------------
source s_network {
    network( transport("udp") port(514) );
    network( transport("tcp") port(601) );
};

# -----------------------------------------------------------------------------
#  PARSER — transforme la ligne JSON Snort en champs structurés
# -----------------------------------------------------------------------------
parser p_snort_json {
    json-parser(prefix(".snort."));
};

# Reformate le timestamp Snort en @timestamp ISO8601 exploitable par Kibana
rewrite r_timestamp {
    set("${ISODATE}", value("@timestamp"));
};

# Marque la source pour distinguer les événements dans Kibana
rewrite r_tag {
    set("snort-ids", value(".snort.log_source"));
};

# -----------------------------------------------------------------------------
#  DESTINATION — Elasticsearch via l'API HTTP (pas de Logstash nécessaire)
#  Index quotidien : snort-alerts-AAAA.MM.JJ
# -----------------------------------------------------------------------------
destination d_elasticsearch {
    elasticsearch-http(
        index("snort-alerts-${YEAR}.${MONTH}.${DAY}")
        type("")
        url("http://elasticsearch:9200/_bulk")
        template("$(format-json --subkeys .snort. --key @timestamp --key log_source)")
        workers(2)
        batch-lines(50)
        batch-timeout(2000)
        persist-name("es-snort")
        # Pour ES 8.x sans sécurité (LAB). Avec sécurité : user()/password().
        headers("Content-Type: application/json")
    );
};

# Copie locale lisible (debug / preuve)
destination d_local_file {
    file("/var/log/snort/syslog-ng-parsed.log"
        template("${ISODATE} ${.snort.msg} src=${.snort.src_addr} dst=${.snort.dst_addr} sid=${.snort.sid}\n")
    );
};

# -----------------------------------------------------------------------------
#  PIPELINES
# -----------------------------------------------------------------------------
log {
    source(s_snort_json);
    parser(p_snort_json);
    rewrite(r_timestamp);
    rewrite(r_tag);
    destination(d_elasticsearch);
    destination(d_local_file);
};

log {
    source(s_network);
    destination(d_local_file);
};
